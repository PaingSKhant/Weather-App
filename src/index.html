<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="header">
      <img src="assets/clear-day.svg" alt="weather icon" id="header-icon" />
      <div id="search-section">
        <input type="text" id="search-bar" />
        <button id="search-btn">Search</button>
      </div>
    </div>

    <div id="display-section" style="display: none">
      <div id="condition">
        <img src="assets/clear-day.gif" alt="" id="background-image" />
        <button id="unit-toggle" data-unit="F">To celcius</button>
        <h2 id="time-zone">Time Zone</h2>
        <img src="assets/clear-day.svg" alt="weather icon" id="icon-image" />
        <p id="temperature">0F</p>
        <p id="feels-like">Feels like</p>
        <h4 id="weather">cloudy</h4>
      </div>
    </div>
  </body>
</html>
